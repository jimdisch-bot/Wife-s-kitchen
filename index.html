<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's for Dinner? ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-select { -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1rem; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8 font-sans text-slate-800 flex flex-col items-center">

    <div class="max-w-4xl w-full">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">The Kitchen Matrix 🍽️</h1>
            <p class="text-sm text-slate-500 mt-1.5">Tailor your perfect menu instantly</p>
        </header>

        <!-- Filter Dashboard Panel -->
        <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Time Selection -->
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Time Frame</label>
                    <select id="timeFilter" class="custom-select w-full bg-slate-50 border border-slate-200 text-slate-700 py-3 px-4 pr-8 rounded-xl font-medium focus:outline-none focus:border-slate-400 transition-all text-sm">
                        <option value="all">⏱️ Any Timeframe</option>
                        <option value="under30">&lt; 30 Minutes</option>
                        <option value="45min">45 Minutes</option>
                        <option value="leisurely">🍷 Leisurely / Slow Cook</option>
                    </select>
                </div>

                <!-- Protein Dropdown -->
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Protein Focus</label>
                    <select id="proteinFilter" class="custom-select w-full bg-slate-50 border border-slate-200 text-slate-700 py-3 px-4 pr-8 rounded-xl font-medium focus:outline-none focus:border-slate-400 transition-all text-sm">
                        <option value="all">🥩 Any Choice</option>
                        <option value="chicken">Chicken</option>
                        <option value="beef">Beef / Steak</option>
                        <option value="pork">Pork</option>
                        <option value="seafood">Seafood / Fish</option>
                        <option value="vegetarian">Vegetarian</option>
                    </select>
                </div>

                <!-- Cuisine Dropdown -->
                <div>
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Cuisine Style</label>
                    <select id="cuisineFilter" class="custom-select w-full bg-slate-50 border border-slate-200 text-slate-700 py-3 px-4 pr-8 rounded-xl font-medium focus:outline-none focus:border-slate-400 transition-all text-sm">
                        <option value="all">🌏 Any Cuisine</option>
                        <option value="italian">Italian</option>
                        <option value="asian">Asian Inspired</option>
                        <option value="mexican">Mexican / Tex-Mex</option>
                        <option value="mediterranean">Greek / Mediterranean</option>
                        <option value="french">French Classic</option>
                        <option value="american">American Traditional</option>
                    </select>
                </div>
            </div>

            <button id="searchBtn" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-slate-950/10 active:scale-[0.99] transition-all text-center block text-sm cursor-pointer">
                ✨ Generate Match Results
            </button>
        </div>

        <!-- Cards Output Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>

    <!-- Modal Layout -->
    <div id="recipeModal" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl p-6 overflow-y-auto max-h-[85vh] relative border border-slate-100">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl p-2 cursor-pointer">&times;</button>
            <h2 id="modalTitle" class="text-2xl font-bold text-slate-900 pr-6 mb-2"></h2>
            
            <div class="flex flex-wrap gap-2 mb-6">
                <span id="modalTimeBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-600"></span>
                <span id="modalProteinBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700"></span>
                <span id="modalCuisineBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-purple-50 text-purple-700"></span>
            </div>

            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Ingredients</h3>
            <ul id="modalIngredients" class="text-sm space-y-2 text-slate-600 list-disc list-inside mb-6 pl-1"></ul>

            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Directions</h3>
            <ol id="modalSteps" class="text-sm space-y-3 text-slate-600 list-decimal list-inside pl-1"></ol>
        </div>
    </div>

    <script>
        const cookbook = [
            // ITALIAN
            { title: "Crispy Tuscan Garlic Chicken", time: "45min", protein: "chicken", cuisine: "italian", ingredients: ["Chicken thighs (4, skin-on)", "Heavy cream (1/2 cup)", "Sun-dried tomatoes (1/4 cup)", "Fresh spinach (2 cups)", "Garlic cloves (4)", "Italian seasoning"], steps: ["Sear chicken thighs skin-side down until golden brown and crispy, then flip and cook through.", "Remove chicken. In the same pan, sauté minced garlic and chopped sun-dried tomatoes.", "Pour in cream and herbs, bringing to a slow simmer.", "Stir in spinach until wilted, return chicken to pan, and spoon sauce over the top."] },
            { title: "Classic Creamy Shrimp Alfredo", time: "under30", protein: "seafood", cuisine: "italian", ingredients: ["Jumbo shrimp (12, peeled)", "Fettuccine pasta (8 oz)", "Butter (4 tbsp)", "Heavy cream (1 cup)", "Grated Parmesan (1/2 cup)", "Garlic"], steps: ["Boil pasta in salted water until al dente.", "Sauté garlic and shrimp in a skillet with melted butter until shrimp turn pink (about 3 mins).", "Remove shrimp. Pour heavy cream into the skillet and let simmer gently for 5 minutes.", "Whisk in parmesan until smooth, then toss pasta and shrimp back into the rich sauce."] },
            { title: "Slow-Braised Beef Bolognese", time: "leisurely", protein: "beef", cuisine: "italian", ingredients: ["Ground beef (1 lb)", "Crushed tomatoes (28 oz)", "Onion, celery, carrot (finely diced)", "Red wine (1/2 cup)", "Pappardelle pasta"], steps: ["Sauté vegetables in olive oil until soft and translucent.", "Add ground beef and brown completely, draining excess fat if necessary.", "Pour in red wine and let it simmer until reduced by half.", "Stir in crushed tomatoes, reduce heat to low, cover and simmer for 1.5 to 2 hours. Serve over hot pasta."] },

            // ASIAN INSPIRED
            { title: "Honey Garlic Beef Stir-Fry", time: "under30", protein: "beef", cuisine: "asian", ingredients: ["Flank steak (sliced thin)", "Broccoli florets (2 cups)", "Soy sauce (1/4 cup)", "Honey (2 tbsp)", "Fresh ginger & garlic"], steps: ["Whisk soy sauce, honey, minced ginger, and garlic together in a bowl.", "Sear beef strips over high heat in a hot skillet for 3 minutes, then set aside.", "Toss broccoli into the pan with 2 tablespoons of water, steaming until bright green.", "Return beef to pan, pour sauce over top, and let simmer until thick and glaze-like."] },
            { title: "Garlic Chili Crisp Udon Noodles", time: "under30", protein: "vegetarian", cuisine: "asian", ingredients: ["Udon or Ramen noodles", "Chili crisp oil (2 tbsp)", "Soy sauce (1tbsp)", "Garlic cloves (3, minced)", "Green onions"], steps: ["Prepare noodles according to package setup.", "Sauté minced garlic in a clean pan with a splash of oil until fragrant.", "Add noodles, soy sauce, and chili crisp directly to the skillet.", "Toss dynamically for 2 minutes to coat everything thoroughly, then top with chopped green onions."] },
            { title: "Slow-Cooker Sticky Pork Belly", time: "leisurely", protein: "pork", cuisine: "asian", ingredients: ["Pork belly or shoulder (2 lbs)", "Brown sugar (1/4 cup)", "Soy sauce (1/2 cup)", "Rice vinegar (2 tbsp)", "Five-spice powder"], steps: ["Cut pork into uniform bite-sized cubes.", "Whisk brown sugar, soy sauce, vinegar, and five-spice together in your slow cooker liner.", "Add pork blocks and stir to coat completely.", "Cover and cook on low setting for 6-7 hours until pork is melt-in-your-mouth tender."] },

            // MEXICAN / TEX-MEX
            { title: "Skillet Flank Steak Fajitas", time: "under30", protein: "beef", cuisine: "mexican", ingredients: ["Flank steak strips", "Bell peppers (2, sliced)", "White onion (1, sliced)", "Fajita seasoning", "Flour tortillas", "Lime wedges"], steps: ["Toss steak strips thoroughly in fajita spice and lime juice.", "Sear steak strips in a smoking hot skillet for 4 minutes, then set aside to rest.", "Sauté peppers and onions in the same pan until tender-crisp with charred edges.", "Slice across the grain and serve alongside warm flour tortillas."] },
            { title: "Crispy Shredded Pork Carnitas", time: "leisurely", protein: "pork", cuisine: "mexican", ingredients: ["Pork shoulder (3 lbs)", "Orange juice (1/2 cup)", "Lime juice (2 tbsp)", "Garlic powder & Cumin", "Fresh cilantro"], steps: ["Rub pork shoulder with cumin, salt, pepper, and garlic powder.", "Place in slow cooker with orange juice and lime juice. Cook on low for 8 hours.", "Shred meat using two forks.", "For crispy edges, spread meat on a baking sheet and broil for 5 minutes before serving."] },
            { title: "Chipotle Sweet Potato Tacos", time: "under30", protein: "vegetarian", cuisine: "mexican", ingredients: ["Sweet potatoes (cubed)", "Black beans (1 can)", "Chipotle peppers in adobo", "Corn tortillas", "Cotija cheese"], steps: ["Toss cubed sweet potatoes with adobo sauce, salt, and olive oil.", "Roast at 400°F for 20 minutes until tender and crispy on the edges.", "Warm black beans in a small saucepan.", "Assemble in toasted corn tortillas with potatoes, beans, and crumbled cheese."] },

            // MEDITERRANEAN / GREEK
            { title: "Sheet-Pan Greek Lemon Chicken", time: "45min", protein: "chicken", cuisine: "mediterranean", ingredients: ["Chicken breasts (2, cubed)", "Kalamata olives", "Cherry tomatoes", "Feta cheese (crumbled)", "Lemon juice & Olive oil", "Oregano"], steps: ["Toss chicken cubes, tomatoes, and olives on a large baking sheet with oil, lemon juice, and oregano.", "Spread evenly in a single layer.", "Bake at 375°F for 25-30 minutes until chicken is completely cooked through.", "Remove from oven and scatter fresh crumbled feta cheese heavily over the top."] },
            { title: "Garlic Herb Seared Sea Bass", time: "under30", protein: "seafood", cuisine: "mediterranean", ingredients: ["Sea bass or Cod fillets", "Olive oil (2 tbsp)", "Minced garlic", "Fresh parsley", "Lemon slices"], steps: ["Pat fish fillets completely dry and season with salt and pepper.", "Heat olive oil in a skillet over medium-high heat.", "Cook fish for 4 minutes on one side until a golden crust forms, then flip.", "Add garlic, parsley, and lemon slices to the pan, basting the fish for 3 more minutes."] },

            // FRENCH CLASSIC
            { title: "Slow-Cooked Beef Bourguignon", time: "leisurely", protein: "beef", cuisine: "french", ingredients: ["Beef chuck roast (2 lbs, cubed)", "Red wine (2 cups)", "Beef broth (1 cup)", "Pearl onions", "Mushrooms (sliced)", "Bacon strips (3)"], steps: ["Fry bacon in a large heavy pot until crisp, then remove bacon.", "Sear beef cubes in the rendered bacon fat until deep brown on all sides.", "Pour in red wine and broth, scraping up the browned bits from the bottom.", "Add onions and mushrooms, cover tightly, and simmer on low heat for 2.5 hours until beef breaks apart with a spoon."] },
            { title: "Classic Pork Chops au Poivre", time: "under30", protein: "pork", cuisine: "french", ingredients: ["Thick-cut pork chops (2)", "Coarsely crushed peppercorns", "Heavy cream (1/4 cup)", "Beef broth (1/4 cup)", "Butter"], steps: ["Press crushed peppercorns firmly into both sides of the pork chops.", "Sear chops in a hot skillet with butter for 5-6 minutes per side until done.", "Remove chops. Pour broth into the hot pan to deglaze, letting it reduce slightly.", "Stir in heavy cream, simmer for 1 minute to thicken, and pour over the chops."] },

            // AMERICAN TRADITIONAL
            { title: "Cast-Iron Garlic Butter Steak", time: "under30", protein: "beef", cuisine: "american", ingredients: ["Ribeye or New York Strip steak", "Butter (3 tbsp)", "Fresh rosemary", "Garlic cloves (3)", "Coarse sea salt"], steps: ["Bring steak to room temp and season generously with coarse salt and pepper.", "Sear in a smoking hot cast-iron skillet for 3 minutes without moving it.", "Flip steak, drop in butter, smashed garlic, and rosemary sprigs.", "Tilt skillet and continuously spoon the melted foam butter over the steak for 3 more minutes."] },
            { title: "Sheet-Pan Honey Mustard Chicken", time: "45min", protein: "chicken", cuisine: "american", ingredients: ["Chicken breasts (2)", "Baby potatoes (halved)", "Dijon mustard (2 tbsp)", "Honey (2 tbsp)", "Olive oil"], steps: ["Mix honey, mustard, and olive oil together in a cup.", "Arrange halved baby potatoes across a greased baking sheet.", "Place chicken breasts in the center and brush the honey mustard glaze over everything.", "Bake at 400°F for 30-35 minutes until potatoes are crispy and chicken is tender."] }
        ];

        function renderRecipes() {
            const timeVal = document.getElementById('timeFilter').value;
            const proteinVal = document.getElementById('proteinFilter').value;
            const cuisineVal = document.getElementById('cuisineFilter').value;

            let results = cookbook.filter(recipe => {
                const matchTime = (timeVal === 'all' || recipe.time === timeVal);
                const matchProtein = (proteinVal === 'all' || recipe.protein === proteinVal);
                const matchCuisine = (cuisineVal === 'all' || recipe.cuisine === cuisineVal);
                return matchTime && matchProtein && matchCuisine;
            });

            // Smart fallback mechanism: if exact match is empty, show everything that partial matches
            if (results.length === 0) {
                results = cookbook.filter(recipe => {
                    return (recipe.time === timeVal || recipe.protein === proteinVal || recipe.cuisine === cuisineVal);
                });
            }

            const displayPool = results.slice(0, 10);
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (displayPool.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border text-slate-400 font-medium text-sm">No matches found. Try resetting filters to "Any Choice"!</div>`;
                return;
            }

            displayPool.forEach(recipe => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md hover:border-slate-300 active:scale-[0.99] transition-all cursor-pointer flex flex-col justify-between";
                
                let timeLabel = recipe.time === 'under30' ? '⚡ < 30m' : recipe.time === '45min' ? '⏱️ 45m' : '🍷 Leisurely';
                
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-slate-900 text-lg mb-1">${recipe.title}</h3>
                        <p class="text-xs text-slate-400 capitalize mb-4">${recipe.cuisine} • ${recipe.protein}</p>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600">${timeLabel}</span>
                        <span class="text-xs font-bold text-slate-800 flex items-center gap-0.5">View Recipe →</span>
                    </div>
                `;

                card.addEventListener('click', () => openModal(recipe));
                grid.appendChild(card);
            });
        }

        function openModal(recipe) {
            document.getElementById('modalTitle').innerText = recipe.title;
            document.getElementById('modalTimeBadge').innerText = recipe.time === 'under30' ? '⏱️ < 30 Mins' : recipe.time === '45min' ? '⏱️ 45 Mins' : '🍷 Leisurely';
            document.getElementById('modalProteinBadge').innerText = recipe.protein.toUpperCase();
            document.getElementById('modalCuisineBadge').innerText = recipe.cuisine.toUpperCase();

            const ingList = document.getElementById('modalIngredients');
            ingList.innerHTML = '';
            recipe.ingredients.forEach(i => {
                let li = document.createElement('li');
                li.innerText = i;
                ingList.appendChild(li);
            });

            const stepList = document.getElementById('modalSteps');
            stepList.innerHTML = '';
            recipe.steps.forEach(s => {
                let li = document.createElement('li');
                li.innerText = s;
                stepList.appendChild(li);
            });

            document.getElementById('recipeModal').classList.remove('hidden');
        }

        document.getElementById('searchBtn').addEventListener('click', renderRecipes);
        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('recipeModal').classList.add('hidden');
        });
        
        document.getElementById('recipeModal').addEventListener('click', function(e) {
            if(e.target === this) this.classList.add('hidden');
        });

        // Initial setup run
        renderRecipes();
    </script>
</body>
</html>
